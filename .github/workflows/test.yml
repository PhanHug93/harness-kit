name: tests

on:
  # Branch pushes are tested through their pull request. A push to main or a
  # release tag skips the heavy jobs when the same tree already passed (gate).
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer commit on the same pull request or ref cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.gate.outputs.full }}
      tree: ${{ steps.gate.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag matches VERSION
        if: github.ref_type == 'tag'
        run: bash scripts/release.sh --check-tag "$GITHUB_REF_NAME"
      - name: Decide whether this tree still needs the full tests
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-gate.sh >>"$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Lint (release pins, pipe safety, shellcheck, CI groups, gate)
        env:
          CI: 'true'
        run: bash scripts/test.sh --group lint

  tests:
    needs: gate
    if: needs.gate.outputs.full == 'true'
    name: tests (${{ matrix.os }}, ${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        group: [ci-1, ci-2, ci-3, ci-4]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show bash version
        run: bash --version | head -1
      # The full historical campaign runs once per OS: from tags on Linux, from
      # the tagless fixtures on macOS (bash 3.2 and BSD tools are macOS-only).
      - name: Run ${{ matrix.group }}
        env:
          GROUP: ${{ matrix.group }}
        run: |
          skip=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            export HARNESS_MIGRATION_HISTORICAL_SOURCE=tags
            skip=(--skip historical-fixtures)
          else
            export ONE_SHOT_HISTORICAL_CAMPAIGN=skip
          fi
          bash scripts/test.sh --group "$GROUP" ${skip[@]+"${skip[@]}"}

  record:
    needs: [gate, lint, tests]
    if: needs.gate.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Write the tested tree
        env:
          TREE: ${{ needs.gate.outputs.tree }}
        run: printf '%s %s\n' "$TREE" "$GITHUB_RUN_ID" >tested-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tested-tree-${{ needs.gate.outputs.tree }}
          path: tested-tree.txt
          retention-days: 30
