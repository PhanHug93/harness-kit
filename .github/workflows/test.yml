name: drift-test

on:
  # Branch pushes are tested through their pull request; push runs only cover
  # main and release tags, so one commit is not tested twice.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer commit on the same pull request or ref cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drift-test:
    name: bootstrap drift test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show bash version
        run: bash --version | head -1
      - name: Install shellcheck on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Verify release tag matches VERSION
        if: github.ref_type == 'tag'
        run: bash scripts/release.sh --check-tag "$GITHUB_REF_NAME"
      - name: Run release script checks
        run: bash scripts/test-release.sh
      - name: Run workspace repository guard checks
        run: python3 scripts/test-workspace-repository-guard.py
      - name: Run retirement lifecycle checks
        run: python3 scripts/test-agent-retirement.py
      - name: Run bootstrap drift test
        run: bash scripts/test-bootstrap-multi-agent-project.sh
      # Bootstrap already runs onboarding and seats/launcher with inherited PATH.
      - name: Run one-shot and tagged historical migrations
        env:
          HARNESS_MIGRATION_HISTORICAL_SOURCE: tags
        run: bash scripts/test-one-shot-upgrade.sh
      - name: Run tagless historical fixture migration
        run: |
          campaign="$(mktemp -d)"
          trap 'rm -rf "$campaign"' EXIT
          mkdir -p "$campaign/source/scripts"
          cp -R agent-bootstrap "$campaign/source/"
          cp scripts/test-agent-seats-migration.py "$campaign/source/scripts/"
          cp -R scripts/fixtures "$campaign/source/scripts/"
          python3 "$campaign/source/scripts/test-agent-seats-migration.py" \
            --historical-source fixtures --evidence-dir "$campaign/evidence"
      - name: Run seats and launcher with absent PATH
        run: |
          campaign="$(mktemp -d)"
          trap 'rm -rf "$campaign"' EXIT
          mkdir -p "$campaign/target"
          bash scripts/bootstrap-multi-agent-project.sh --target "$campaign/target" --workflow full
          python3 - "$PWD" "$campaign" <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          root, campaign = map(Path, sys.argv[1:])
          env = dict(os.environ, SEATS_QA_BASH="/bin/bash")
          env.pop("PATH", None)
          subprocess.run([sys.executable, str(root / "scripts/test-agent-seats.py"),
                          str(campaign / "target"), str(root / "agent-bootstrap/agent-seats.sh"),
                          str(campaign / "seats.json")], env=env, check=True)
          subprocess.run([sys.executable, str(root / "scripts/test-agent-seats-launcher.py")],
                         env=env, check=True)
          PY
      - name: Run generated target verifier
        run: |
          tmp="$(mktemp -d)"
          bash scripts/bootstrap-multi-agent-project.sh --target "$tmp" --workflow full
          cd "$tmp"
          scripts/verify-ai-deps.sh
          scripts/verify-ai-deps.sh --json | python3 -m json.tool >/dev/null
      - name: Run shellcheck if available
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --external-sources --exclude=SC1090,SC1091,SC2034,SC2154 \
              scripts/bootstrap-multi-agent-project.sh \
              scripts/install-agent-bootstrap-home.sh \
              scripts/test-bootstrap-multi-agent-project.sh \
              scripts/test-onboarding-fixtures.sh \
              scripts/test-one-shot-upgrade.sh \
              agent-bootstrap/bootstrap-multi-agent-project.sh \
              agent-bootstrap/harness-kit-one-shot.sh \
              agent-bootstrap/harness-kit-one-shot-upgrade.sh \
              agent-bootstrap/harness-kit-run.sh \
              agent-bootstrap/lib/migrations.sh \
              scripts/test-verification-evidence.sh \
              scripts/test-harness-kit-entry.sh \
              scripts/test-harness-migrations.sh \
              scripts/test-harness-kit-staging.sh \
              scripts/test-harness-kit-oneshot.sh \
              scripts/test-change-tiers.sh \
              agent-bootstrap/agent-bootstrap-update.sh \
              agent-bootstrap/install-agent-bootstrap-home.sh \
              agent-bootstrap/install-rtk.sh \
              agent-bootstrap/rtk \
              agent-bootstrap/agent-hook.sh \
              agent-bootstrap/agent-guard.sh \
              agent-bootstrap/agent-seats.sh \
              agent-bootstrap/verify-ai-deps.sh \
              agent-bootstrap/lib/core.sh \
              agent-bootstrap/lib/overlays.sh \
              agent-bootstrap/lib/detect.sh \
              agent-bootstrap/lib/render.sh \
              agent-bootstrap/lib/writers-runtime.sh \
              agent-bootstrap/lib/writers-docs.sh \
              agent-bootstrap/lib/onboarding.sh
            shellcheck --shell=bash --exclude=SC1090,SC1091,SC2034,SC2154 agent-bootstrap/migrations/*.sh
          else
            echo "shellcheck not installed; skipping optional shell lint"
          fi
      - name: Run shellcheck on generated target if available
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            tmp="$(mktemp -d)"
            bash scripts/bootstrap-multi-agent-project.sh --target "$tmp" --workflow full
            shellcheck --external-sources --exclude=SC1090,SC1091,SC2034,SC2154 \
              "$tmp"/scripts/*.sh \
              "$tmp"/.codex/codex-mode.sh
          else
            echo "shellcheck not installed; skipping optional generated target shell lint"
          fi
